<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐队排练曲目记录</title>
  <style>
    :root {
      --bg: #f7fbff;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-strong: #ffffff;
      --text: #263247;
      --muted: #6f8197;
      --line: rgba(98, 146, 197, 0.16);
      --primary: #18b7a5;
      --primary-strong: #0f8176;
      --primary-soft: rgba(24, 183, 165, 0.1);
      --accent: #17a0d2;
      --danger: #ea6277;
      --danger-soft: rgba(234, 98, 119, 0.12);
      --shadow: 0 20px 48px rgba(114, 153, 197, 0.14);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 10%, rgba(255, 228, 181, 0.36), transparent 20%),
        radial-gradient(circle at 92% 18%, rgba(191, 244, 234, 0.42), transparent 24%),
        linear-gradient(180deg, #f8fdff 0%, #edf8ff 100%);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: grid;
      gap: 20px;
      padding: 30px;
      margin-bottom: 22px;
      border: 1px solid rgba(24, 183, 165, 0.14);
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at top right, rgba(255, 209, 146, 0.28), transparent 28%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(238, 249, 246, 0.96));
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary-strong);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.08;
    }

    .hero-copy,
    .muted {
      color: var(--muted);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .module-tabs {
      display: inline-flex;
      gap: 10px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 0 0 1px rgba(98, 146, 197, 0.12);
    }

    .module-tab {
      padding: 12px 18px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .module-tab.active {
      background: linear-gradient(135deg, #18b7a5, #17a0d2);
      color: #fff;
      box-shadow: 0 10px 20px rgba(23, 160, 210, 0.18);
    }

    .module-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .ghost-btn,
    .danger-btn,
    .icon-btn,
    .mini-btn {
      border-radius: 999px;
      transition: transform 0.18s ease, background-color 0.18s ease, opacity 0.18s ease;
    }

    .primary-btn,
    .ghost-btn,
    .danger-btn {
      padding: 11px 16px;
    }

    .mini-btn {
      padding: 7px 12px;
      font-size: 0.88rem;
      background: rgba(98, 146, 197, 0.1);
      color: var(--primary-strong);
    }

    .primary-btn {
      background: linear-gradient(135deg, #18b7a5, #17a0d2);
      color: #fff;
    }

    .ghost-btn {
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .danger-btn {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 1.4rem;
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .primary-btn:hover,
    .ghost-btn:hover,
    .danger-btn:hover,
    .icon-btn:hover,
    .mini-btn:hover,
    .clickable-card:hover {
      transform: translateY(-1px);
    }

    .module-panel {
      display: grid;
      grid-template-columns: 1.02fr 1fr;
      gap: 22px;
    }

    .panel {
      position: relative;
      border: 1px solid rgba(98, 146, 197, 0.1);
      border-radius: var(--radius-xl);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .section-head,
    .detail-header,
    .form-actions,
    .modal-head,
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .search-field {
      display: grid;
      gap: 6px;
      min-width: 220px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .search-field input,
    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
    }

    .song-list,
    .playlist-list,
    .song-group {
      display: grid;
      gap: 14px;
    }

    .song-list,
    .playlist-list {
      margin-top: 20px;
    }

    .song-group-title {
      margin-top: 8px;
      padding-left: 4px;
      color: var(--primary-strong);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .clickable-card,
    .summary-card {
      border: 1px solid rgba(98, 146, 197, 0.12);
      border-radius: var(--radius-lg);
      background: var(--panel-strong);
    }

    .clickable-card {
      padding: 18px;
      cursor: pointer;
      outline: none;
    }

    .clickable-card.active {
      border-color: rgba(24, 183, 165, 0.42);
      box-shadow: inset 0 0 0 1px rgba(24, 183, 165, 0.14);
    }

    .clickable-card:hover,
    .clickable-card:focus-visible {
      box-shadow:
        0 12px 28px rgba(114, 153, 197, 0.12),
        inset 0 0 0 1px rgba(24, 183, 165, 0.14);
    }

    .song-title-row,
    .playlist-title-row,
    .playlist-song-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .song-meta,
    .playlist-meta,
    .member-list,
    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .song-meta,
    .playlist-meta,
    .member-list {
      margin-top: 12px;
    }

    .tag,
    .member-tag,
    .index-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(24, 183, 165, 0.1);
      color: var(--primary-strong);
      font-size: 0.88rem;
    }

    .index-chip {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 0 1px rgba(24, 183, 165, 0.12);
      justify-content: center;
      width: 30px;
      min-height: 30px;
      padding: 0;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .playlist-notes {
      margin-top: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .alpha-index {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: grid;
      gap: 6px;
      padding: 8px 5px;
      border: 1px solid rgba(98, 146, 197, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 30px rgba(114, 153, 197, 0.16);
    }

    .alpha-index-btn {
      width: 30px;
      min-height: 30px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: var(--primary-strong);
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(24, 183, 165, 0.12);
    }

    .detail-panel {
      min-height: 520px;
    }

    .summary-card {
      padding: 20px;
      margin-bottom: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .info-grid > div {
      padding: 16px;
      border: 1px solid rgba(98, 146, 197, 0.12);
      border-radius: 18px;
      background: rgba(248, 252, 255, 0.94);
    }

    .full-span {
      grid-column: 1 / -1;
    }

    .info-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .info-value {
      line-height: 1.6;
      word-break: break-word;
    }

    .text-link {
      color: var(--primary-strong);
      text-decoration: none;
      word-break: break-all;
    }

    .scene-tabs,
    .scenario-switch {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .scene-tab,
    .scenario-btn {
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-weight: 700;
    }

    .scene-tab.active,
    .scenario-btn.active {
      background: linear-gradient(135deg, #18b7a5, #17a0d2);
      color: #fff;
    }

    .lyrics-section {
      margin-top: 16px;
    }

    .lyrics-preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .lyrics-preview,
    .lyrics-textarea {
      width: 100%;
      margin: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.95);
      font-family: "SFMono-Regular", "Cascadia Code", "Consolas", "Menlo", monospace;
      font-size: 0.95rem;
      line-height: 1.65;
      white-space: pre-wrap;
      resize: vertical;
      overflow-x: auto;
    }

    .lyrics-preview {
      min-height: 180px;
    }

    .compact-preview,
    .compact-textarea,
    .compact-empty {
      min-height: 84px;
    }

    .lyrics-editor {
      display: grid;
      gap: 14px;
    }

    .lyrics-editor label,
    .form-grid label,
    .member-grid,
    .member-select-field {
      display: grid;
      gap: 8px;
    }

    .detail-empty,
    .empty-state {
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .detail-empty {
      min-height: 220px;
    }

    .compact-empty {
      border: 1px dashed var(--line);
      border-radius: 18px;
    }

    .empty-state {
      min-height: 260px;
    }

    .back-btn {
      margin-bottom: 12px;
    }

    .mobile-only {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(71, 92, 124, 0.18);
      backdrop-filter: blur(8px);
      z-index: 40;
    }

    .modal-card {
      width: min(760px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 28px 60px rgba(114, 153, 197, 0.22);
      padding: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .member-grid {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      background: rgba(247, 252, 255, 0.72);
    }

    .member-grid legend {
      padding: 0 8px;
      color: var(--muted);
    }

    .multi-picker {
      position: relative;
    }

    .picker-toggle {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .picker-toggle-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .picker-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 18px 36px rgba(114, 153, 197, 0.12);
    }

    .picker-panel label {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
      white-space: nowrap;
    }

    .playlist-builder {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .playlist-box {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(248, 252, 255, 0.94);
    }

    .playlist-box h4 {
      margin-bottom: 10px;
    }

    .playlist-song-option,
    .playlist-draft-item,
    .playlist-detail-song {
      padding: 12px 14px;
      border: 1px solid rgba(98, 146, 197, 0.12);
      border-radius: 16px;
      background: #fff;
    }

    .playlist-song-option + .playlist-song-option,
    .playlist-draft-item + .playlist-draft-item,
    .playlist-detail-song + .playlist-detail-song {
      margin-top: 10px;
    }

    .playlist-song-option label {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .playlist-draft-item {
      display: grid;
      gap: 10px;
    }

    .playlist-draft-item .toolbar,
    .playlist-song-row {
      align-items: flex-start;
    }

    .playlist-order-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .playlist-detail-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .playlist-detail-song {
      cursor: pointer;
    }

    .playlist-detail-song-number {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: rgba(24, 183, 165, 0.12);
      color: var(--primary-strong);
      font-weight: 700;
      flex-shrink: 0;
    }

    .notes-preview {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 960px) {
      .module-panel {
        grid-template-columns: 1fr;
      }

      .detail-panel {
        min-height: auto;
      }

      .mobile-only {
        display: inline-flex;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        padding: 16px;
      }

      .hero,
      .section-head,
      .detail-header,
      .topbar,
      .form-actions,
      .modal-head,
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .form-grid,
      .lyrics-preview-grid,
      .member-grid,
      .playlist-builder,
      .picker-panel,
      .info-grid {
        grid-template-columns: 1fr;
      }

      .search-field {
        min-width: 0;
      }

      .alpha-index {
        right: 8px;
        gap: 5px;
        padding: 7px 4px;
        border-radius: 16px;
      }

      .alpha-index-btn {
        width: 28px;
        min-height: 28px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="topbar">
        <div>
          <p class="eyebrow">BAND REHEARSAL TOOL</p>
          <h1>乐队排练曲目记录</h1>
          <p class="hero-copy">看同一个谱、弹同一个调✌️</p>
        </div>
        <div class="module-tabs" role="tablist" aria-label="模块切换">
          <button id="tab-songs" class="module-tab active" type="button" data-module="songs">🎵 曲目</button>
          <button id="tab-playlists" class="module-tab" type="button" data-module="playlists">📋 歌单</button>
        </div>
      </div>
      <div class="module-actions">
        <button id="add-song-btn" class="primary-btn">新增曲目</button>
        <button id="add-playlist-btn" class="primary-btn hidden">新建歌单</button>
      </div>
    </header>

    <main>
      <section id="songs-module" class="module-panel">
        <section id="song-list-view" class="panel">
          <div class="section-head">
            <div>
              <h2>曲目列表</h2>
              <p id="song-count" class="muted"></p>
            </div>
            <label class="search-field">
              <span>搜索歌名</span>
              <input id="song-search" type="search" placeholder="搜索歌名">
            </label>
          </div>
          <div id="song-list" class="song-list"></div>
          <div id="song-empty" class="empty-state hidden">
            <p>还没有曲目，先新增一首歌吧。</p>
          </div>
          <div id="alpha-index" class="alpha-index hidden" aria-label="首字母索引"></div>
        </section>

        <section id="song-detail-view" class="panel detail-panel hidden">
          <button id="song-back-btn" class="ghost-btn back-btn mobile-only">返回曲目列表</button>
          <div id="song-detail-content"></div>
        </section>
      </section>

      <section id="playlists-module" class="module-panel hidden">
        <section id="playlist-list-view" class="panel">
          <div class="section-head">
            <div>
              <h2>歌单列表</h2>
              <p id="playlist-count" class="muted"></p>
            </div>
          </div>
          <div id="playlist-list" class="playlist-list"></div>
          <div id="playlist-empty" class="empty-state hidden">
            <p>还没有歌单，先新建一个吧。</p>
          </div>
        </section>

        <section id="playlist-detail-view" class="panel detail-panel hidden">
          <button id="playlist-back-btn" class="ghost-btn back-btn mobile-only">返回歌单列表</button>
          <div id="playlist-detail-content"></div>
        </section>
      </section>
    </main>
  </div>

  <div id="song-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="song-modal-title">新增曲目</h3>
        <button class="icon-btn" type="button" data-close="song-modal" aria-label="关闭">×</button>
      </div>
      <form id="song-form" class="form-grid">
        <input id="song-id" type="hidden">
        <label>
          <span>曲名</span>
          <input id="song-title" type="text" required maxlength="80" placeholder="例如：Hotel California">
        </label>
        <label>
          <span>调号</span>
          <input id="song-key" type="text" maxlength="20" placeholder="可输入 Capo 2 / F# 等">
        </label>
        <label>
          <span>熟练度</span>
          <select id="song-level" required>
            <option value="1">很不熟练</option>
            <option value="2">可以顺下来</option>
            <option value="3">可以练摊儿</option>
            <option value="4">可以去tribute演</option>
          </select>
        </label>
        <label class="full-span">
          <span>谱子链接</span>
          <input id="song-chart" type="text" maxlength="300" placeholder="可粘贴网盘、文档或任意文本链接">
        </label>

        <fieldset class="full-span member-grid">
          <legend>乐队成员配置</legend>
          <div class="scenario-switch full-span">
            <button type="button" class="scenario-btn active" data-scene="withDrums">有鼓</button>
            <button type="button" class="scenario-btn" data-scene="withoutDrums">无鼓</button>
          </div>

          <div class="member-select-field multi-picker">
            <span>vocal（可多选）</span>
            <button id="song-vocal-toggle" class="picker-toggle" type="button" aria-expanded="false">
              <span class="picker-toggle-text">请选择 vocal</span>
              <span>⌄</span>
            </button>
            <div id="song-vocal-panel" class="picker-panel hidden">
              <label><input type="checkbox" name="song-vocals" value="米粉儿">米粉儿</label>
              <label><input type="checkbox" name="song-vocals" value="坤哥">坤哥</label>
              <label><input type="checkbox" name="song-vocals" value="沈总">沈总</label>
              <label><input type="checkbox" name="song-vocals" value="谢老师">谢老师</label>
              <label><input type="checkbox" name="song-vocals" value="小京">小京</label>
            </div>
          </div>

          <div class="member-select-field multi-picker">
            <span>guitar（可多选）</span>
            <button id="song-guitar-toggle" class="picker-toggle" type="button" aria-expanded="false">
              <span class="picker-toggle-text">请选择 guitar</span>
              <span>⌄</span>
            </button>
            <div id="song-guitar-panel" class="picker-panel hidden">
              <label><input type="checkbox" name="song-guitars" value="米粉儿">米粉儿</label>
              <label><input type="checkbox" name="song-guitars" value="坤哥">坤哥</label>
              <label><input type="checkbox" name="song-guitars" value="沈总">沈总</label>
              <label><input type="checkbox" name="song-guitars" value="谢老师">谢老师</label>
              <label><input type="checkbox" name="song-guitars" value="小京">小京</label>
            </div>
          </div>

          <label class="member-select-field">
            <span>bass</span>
            <select id="song-bass">
              <option value="">不选</option>
              <option value="米粉儿">米粉儿</option>
              <option value="坤哥">坤哥</option>
              <option value="沈总">沈总</option>
              <option value="谢老师">谢老师</option>
              <option value="小京">小京</option>
            </select>
          </label>

          <label class="member-select-field">
            <span>drum</span>
            <select id="song-drum">
              <option value="">不选</option>
              <option value="米粉儿">米粉儿</option>
              <option value="坤哥">坤哥</option>
              <option value="沈总">沈总</option>
              <option value="谢老师">谢老师</option>
              <option value="小京">小京</option>
            </select>
          </label>

          <label class="member-select-field">
            <span>keyboard</span>
            <select id="song-keyboard">
              <option value="米粉儿">米粉儿</option>
              <option value="坤哥">坤哥</option>
              <option value="沈总">沈总</option>
              <option value="谢老师">谢老师</option>
              <option value="小京">小京</option>
            </select>
          </label>
        </fieldset>

        <div class="form-actions full-span">
          <button type="button" class="ghost-btn" data-close="song-modal">取消</button>
          <button type="submit" class="primary-btn">保存曲目</button>
        </div>
      </form>
    </div>
  </div>

  <div id="playlist-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="playlist-modal-title">新建歌单</h3>
        <button class="icon-btn" type="button" data-close="playlist-modal" aria-label="关闭">×</button>
      </div>
      <form id="playlist-form" class="form-grid">
        <input id="playlist-id" type="hidden">
        <label>
          <span>歌单名称</span>
          <input id="playlist-name" type="text" required maxlength="80" placeholder="例如：周末路演歌单">
        </label>
        <label>
          <span>场景类型</span>
          <select id="playlist-scene" required>
            <option value="路边演出">路边演出</option>
            <option value="tribute酒吧">tribute酒吧</option>
            <option value="婚礼">婚礼</option>
            <option value="其他">其他</option>
          </select>
        </label>
        <label class="full-span">
          <span>备注</span>
          <textarea id="playlist-notes" rows="4" placeholder="可记录节奏安排、串场说明、演出注意事项"></textarea>
        </label>
        <div class="full-span playlist-builder">
          <div class="playlist-box">
            <h4>从已有曲目中选择</h4>
            <div id="playlist-song-options"></div>
          </div>
          <div class="playlist-box">
            <h4>已选曲目顺序</h4>
            <div id="playlist-selected-list"></div>
          </div>
        </div>
        <div class="form-actions full-span">
          <button type="button" class="ghost-btn" data-close="playlist-modal">取消</button>
          <button type="submit" class="primary-btn">保存歌单</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SONG_STORAGE_KEY = "band-rehearsal-tracker-v1";
    const SONG_STORAGE_FALLBACK_KEY = "band-rehearsal-tracker-songs-v2";
    const PLAYLIST_STORAGE_KEY = "band-rehearsal-tracker-playlists-v1";
    const DEFAULT_LYRICS_TEMPLATE = ["Intro", "A段主歌", "B段副歌", "桥段", "结尾"]
      .map((section) => `[${section}]`)
      .join("\n\n");
    const LEVEL_LABELS = {
      1: "很不熟练",
      2: "可以顺下来",
      3: "可以练摊儿",
      4: "可以去tribute演"
    };
    const DEFAULT_BAND_SETUP = {
      vocals: ["米粉儿"],
      guitars: ["坤哥", "沈总"],
      bass: "",
      drum: "谢老师",
      keyboard: "小京"
    };
    const BAND_SCENES = {
      withDrums: "有鼓",
      withoutDrums: "无鼓"
    };

    const state = {
      module: "songs",
      songs: loadSongs(),
      playlists: loadPlaylists(),
      selectedSongId: null,
      selectedPlaylistId: null,
      songSearch: "",
      songMobileView: "list",
      playlistMobileView: "list",
      editingBandScene: "withDrums",
      editingBandSetupScenes: createDefaultBandSetupScenes(),
      viewingBandScene: "withDrums",
      playlistDraftSongIds: []
    };

    const elements = {
      tabSongs: document.getElementById("tab-songs"),
      tabPlaylists: document.getElementById("tab-playlists"),
      songsModule: document.getElementById("songs-module"),
      playlistsModule: document.getElementById("playlists-module"),
      addSongBtn: document.getElementById("add-song-btn"),
      addPlaylistBtn: document.getElementById("add-playlist-btn"),
      songSearch: document.getElementById("song-search"),
      songCount: document.getElementById("song-count"),
      songList: document.getElementById("song-list"),
      songEmpty: document.getElementById("song-empty"),
      songDetailView: document.getElementById("song-detail-view"),
      songDetailContent: document.getElementById("song-detail-content"),
      songListView: document.getElementById("song-list-view"),
      songBackBtn: document.getElementById("song-back-btn"),
      alphaIndex: document.getElementById("alpha-index"),
      playlistCount: document.getElementById("playlist-count"),
      playlistList: document.getElementById("playlist-list"),
      playlistEmpty: document.getElementById("playlist-empty"),
      playlistDetailView: document.getElementById("playlist-detail-view"),
      playlistDetailContent: document.getElementById("playlist-detail-content"),
      playlistListView: document.getElementById("playlist-list-view"),
      playlistBackBtn: document.getElementById("playlist-back-btn"),
      songModal: document.getElementById("song-modal"),
      songForm: document.getElementById("song-form"),
      playlistModal: document.getElementById("playlist-modal"),
      playlistForm: document.getElementById("playlist-form"),
      playlistSongOptions: document.getElementById("playlist-song-options"),
      playlistSelectedList: document.getElementById("playlist-selected-list")
    };

    bootstrap();

    function bootstrap() {
      if (state.songs.length > 0) {
        state.selectedSongId = state.songs[0].id;
      }
      if (state.playlists.length > 0) {
        state.selectedPlaylistId = state.playlists[0].id;
      }

      bindEvents();
      render();
    }

    function bindEvents() {
      elements.tabSongs.addEventListener("click", () => switchModule("songs"));
      elements.tabPlaylists.addEventListener("click", () => switchModule("playlists"));
      elements.addSongBtn.addEventListener("click", () => openSongModal());
      elements.addPlaylistBtn.addEventListener("click", () => openPlaylistModal());
      elements.songSearch.addEventListener("input", (event) => {
        state.songSearch = event.target.value.trim().toLowerCase();
        renderSongList();
      });
      elements.songBackBtn.addEventListener("click", () => {
        state.songMobileView = "list";
        syncMobileLayout();
      });
      elements.playlistBackBtn.addEventListener("click", () => {
        state.playlistMobileView = "list";
        syncMobileLayout();
      });

      elements.songForm.addEventListener("submit", handleSongSubmit);
      elements.playlistForm.addEventListener("submit", handlePlaylistSubmit);
      bindMultiPicker("song-vocal-toggle", "song-vocal-panel", "song-vocals", "请选择 vocal");
      bindMultiPicker("song-guitar-toggle", "song-guitar-panel", "song-guitars", "请选择 guitar");
      bindBandSceneSwitch();

      document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => closeModal(button.dataset.close));
      });

      [elements.songModal, elements.playlistModal].forEach((modal) => {
        modal.addEventListener("click", (event) => {
          if (event.target === modal) {
            closeModal(modal.id);
          }
        });
      });

      window.addEventListener("resize", syncMobileLayout);
    }

    function switchModule(module) {
      state.module = module;
      renderModuleTabs();
      renderModuleViews();
      syncMobileLayout();
    }

    function render() {
      renderModuleTabs();
      renderSongList();
      renderSongDetail();
      renderPlaylistList();
      renderPlaylistDetail();
      renderModuleViews();
      syncMobileLayout();
    }

    function renderModuleTabs() {
      const isSongs = state.module === "songs";
      elements.tabSongs.classList.toggle("active", isSongs);
      elements.tabPlaylists.classList.toggle("active", !isSongs);
      elements.addSongBtn.classList.toggle("hidden", !isSongs);
      elements.addPlaylistBtn.classList.toggle("hidden", isSongs);
    }

    function renderModuleViews() {
      const isSongs = state.module === "songs";
      elements.songsModule.classList.toggle("hidden", !isSongs);
      elements.playlistsModule.classList.toggle("hidden", isSongs);
      elements.alphaIndex.classList.toggle("hidden", !isSongs || elements.alphaIndex.innerHTML === "");
    }

    function renderSongList() {
      const filteredSongs = getFilteredSongs();
      elements.songCount.textContent = `共 ${filteredSongs.length} 首曲目`;
      elements.songEmpty.classList.toggle("hidden", state.songs.length !== 0);
      elements.songList.innerHTML = "";
      elements.alphaIndex.innerHTML = "";
      elements.alphaIndex.classList.add("hidden");

      if (filteredSongs.length === 0 && state.songs.length > 0) {
        elements.songList.innerHTML = `<div class="detail-empty"><p>没有匹配的曲目。</p></div>`;
        return;
      }

      const groupedSongs = groupSongsByInitial(filteredSongs);
      groupedSongs.forEach(({ initial, songs }) => {
        const group = document.createElement("section");
        group.className = "song-group";
        group.id = `group-${initial === "#" ? "hash" : initial.toLowerCase()}`;
        group.innerHTML = `<h3 class="song-group-title">${escapeHtml(initial)}</h3>`;

        songs.forEach((song) => {
          const card = document.createElement("article");
          card.className = `clickable-card${song.id === state.selectedSongId ? " active" : ""}`;
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `查看曲目 ${song.title}`);
          card.dataset.action = "view-song";
          card.dataset.id = song.id;
          card.innerHTML = `
            <div class="song-title-row">
              <h3>${escapeHtml(song.title)}</h3>
            </div>
            <div class="song-meta">
              <span class="tag">调号 ${escapeHtml(song.key || "未填写")}</span>
              <span class="tag">${escapeHtml(renderLevel(song.level))}</span>
              ${song.chartLink ? `<span class="tag">有谱子链接</span>` : ""}
              ${song.chordProgression || song.lyrics ? `<span class="tag">有歌词与和弦</span>` : ""}
            </div>
          `;
          group.appendChild(card);
        });

        elements.songList.appendChild(group);
      });

      renderAlphaIndex(groupedSongs);

      elements.songList.querySelectorAll('.clickable-card[data-action="view-song"]').forEach((card) => {
        bindCardAction(card, handleSongActions);
      });
    }

    function renderAlphaIndex(groupedSongs) {
      if (!groupedSongs.length) {
        return;
      }

      elements.alphaIndex.innerHTML = groupedSongs.map(({ initial }) => `
        <button type="button" class="alpha-index-btn" data-letter-target="${initial}">${escapeHtml(initial)}</button>
      `).join("");
      elements.alphaIndex.classList.remove("hidden");

      elements.alphaIndex.querySelectorAll("[data-letter-target]").forEach((button) => {
        button.addEventListener("click", () => {
          const initial = button.dataset.letterTarget;
          const targetId = `group-${initial === "#" ? "hash" : initial.toLowerCase()}`;
          const target = document.getElementById(targetId);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
      });
    }

    function renderSongDetail() {
      const song = findSong(state.selectedSongId);
      if (!song) {
        elements.songDetailContent.innerHTML = `
          <div class="detail-empty">
            <div>
              <h3>选择一首曲目查看详情</h3>
              <p>你可以从左侧列表进入，或先新增曲目。</p>
            </div>
          </div>
        `;
        return;
      }

      const chartLink = song.chartLink
        ? `<a class="text-link" href="${escapeAttribute(song.chartLink)}" target="_blank" rel="noreferrer">${escapeHtml(song.chartLink)}</a>`
        : `<span class="muted">未填写</span>`;
      const chordsPreview = song.chordProgression
        ? `<pre class="lyrics-preview compact-preview">${escapeHtml(song.chordProgression)}</pre>`
        : `<div class="detail-empty compact-empty"><p>还没有填写和弦走向。</p></div>`;
      const lyricsPreview = song.lyrics
        ? `<pre class="lyrics-preview">${escapeHtml(song.lyrics)}</pre>`
        : `<div class="detail-empty compact-empty"><p>还没有填写歌词。</p></div>`;

      elements.songDetailContent.innerHTML = `
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>${escapeHtml(song.title)}</h2>
              <p class="muted">调号 ${escapeHtml(song.key || "未填写")} · 熟练度 ${escapeHtml(renderLevel(song.level))}</p>
            </div>
            <div class="inline-actions">
              <button class="ghost-btn" type="button" data-action="edit-song" data-id="${song.id}">编辑</button>
              <button class="danger-btn" type="button" data-action="delete-song" data-id="${song.id}">删除</button>
            </div>
          </div>
        </section>
        <section class="summary-card info-grid">
          <div>
            <p class="info-label">曲名</p>
            <p class="info-value">${escapeHtml(song.title)}</p>
          </div>
          <div>
            <p class="info-label">调号</p>
            <p class="info-value">${escapeHtml(song.key || "未填写")}</p>
          </div>
          <div>
            <p class="info-label">熟练度</p>
            <p class="info-value">${escapeHtml(renderLevel(song.level))}</p>
          </div>
          <div>
            <p class="info-label">谱子链接</p>
            <div class="info-value">${chartLink}</div>
          </div>
          <div class="full-span">
            <p class="info-label">乐队成员配置</p>
            ${renderBandSetupTabs(song.bandSetup)}
          </div>
        </section>
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>歌词与和弦</h2>
              <p class="muted">拆分记录和弦走向与歌词段落，保留换行并使用等宽字体。</p>
            </div>
            <button class="ghost-btn" type="button" data-action="edit-lyrics" data-song-id="${song.id}">编辑歌词与和弦</button>
          </div>
          <div class="lyrics-section">
            <div id="lyrics-preview-wrap" class="lyrics-preview-grid">
              <div>
                <p class="info-label">和弦走向</p>
                ${chordsPreview}
              </div>
              <div>
                <p class="info-label">歌词</p>
                ${lyricsPreview}
              </div>
            </div>
            <div id="lyrics-editor-wrap" class="lyrics-editor hidden">
              <div class="lyrics-preview-grid">
                <label>
                  <span>和弦走向</span>
                  <textarea id="chord-input" rows="2" class="lyrics-textarea compact-textarea" placeholder="例如：1645">${escapeHtml(song.chordProgression || "")}</textarea>
                </label>
                <label>
                  <span>歌词</span>
                  <textarea id="lyrics-input" rows="10" class="lyrics-textarea">${escapeHtml(song.lyrics || DEFAULT_LYRICS_TEMPLATE)}</textarea>
                </label>
              </div>
              <div class="form-actions">
                <button class="ghost-btn" type="button" data-action="cancel-lyrics">取消</button>
                <button class="primary-btn" type="button" data-action="save-lyrics" data-song-id="${song.id}">保存歌词与和弦</button>
              </div>
            </div>
          </div>
        </section>
      `;

      elements.songDetailContent.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", handleSongActions);
      });
    }

    function renderPlaylistList() {
      elements.playlistCount.textContent = `共 ${state.playlists.length} 个歌单`;
      elements.playlistEmpty.classList.toggle("hidden", state.playlists.length !== 0);
      elements.playlistList.innerHTML = "";

      if (state.playlists.length === 0) {
        return;
      }

      state.playlists.forEach((playlist) => {
        const songs = playlist.songIds.map(findSong).filter(Boolean);
        const card = document.createElement("article");
        card.className = `clickable-card${playlist.id === state.selectedPlaylistId ? " active" : ""}`;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `查看歌单 ${playlist.name}`);
        card.dataset.action = "view-playlist";
        card.dataset.id = playlist.id;
        card.innerHTML = `
          <div class="playlist-title-row">
            <h3>${escapeHtml(playlist.name)}</h3>
          </div>
          <div class="playlist-meta">
            <span class="tag">${escapeHtml(playlist.scene)}</span>
            <span class="tag">${songs.length} 首曲目</span>
          </div>
          <p class="playlist-notes notes-preview">${escapeHtml(playlist.notes || "暂无备注")}</p>
        `;
        elements.playlistList.appendChild(card);
      });

      elements.playlistList.querySelectorAll('.clickable-card[data-action="view-playlist"]').forEach((card) => {
        bindCardAction(card, handlePlaylistActions);
      });
    }

    function renderPlaylistDetail() {
      const playlist = findPlaylist(state.selectedPlaylistId);
      if (!playlist) {
        elements.playlistDetailContent.innerHTML = `
          <div class="detail-empty">
            <div>
              <h3>选择一个歌单查看详情</h3>
              <p>你可以从左侧列表进入，或先新建歌单。</p>
            </div>
          </div>
        `;
        return;
      }

      const songs = playlist.songIds.map(findSong).filter(Boolean);
      elements.playlistDetailContent.innerHTML = `
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>${escapeHtml(playlist.name)}</h2>
              <p class="muted">${escapeHtml(playlist.scene)} · ${songs.length} 首曲目</p>
            </div>
            <div class="inline-actions">
              <button class="ghost-btn" type="button" data-action="edit-playlist" data-id="${playlist.id}">编辑</button>
              <button class="danger-btn" type="button" data-action="delete-playlist" data-id="${playlist.id}">删除</button>
            </div>
          </div>
        </section>
        <section class="summary-card info-grid">
          <div>
            <p class="info-label">歌单名称</p>
            <p class="info-value">${escapeHtml(playlist.name)}</p>
          </div>
          <div>
            <p class="info-label">场景类型</p>
            <p class="info-value">${escapeHtml(playlist.scene)}</p>
          </div>
          <div class="full-span">
            <p class="info-label">备注</p>
            <p class="info-value">${escapeHtml(playlist.notes || "暂无备注")}</p>
          </div>
        </section>
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>曲目清单</h2>
              <p class="muted">点击单曲可进入曲目详情，适合排练和演出时快速查看。</p>
            </div>
          </div>
          <div class="playlist-detail-list">
            ${songs.length ? songs.map((song, index) => renderPlaylistSongDetailItem(song, index)).join("") : `<div class="detail-empty"><p>这个歌单里还没有曲目。</p></div>`}
          </div>
        </section>
      `;

      elements.playlistDetailContent.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", handlePlaylistActions);
      });
      elements.playlistDetailContent.querySelectorAll('[data-action="open-song-from-playlist"]').forEach((card) => {
        bindCardAction(card, handlePlaylistActions);
      });
    }

    function renderPlaylistSongDetailItem(song, index) {
      const bandSummary = summarizeBandSetup(normalizeBandSetupScenes(song.bandSetup).withDrums);
      return `
        <article class="playlist-detail-song" tabindex="0" role="button" data-action="open-song-from-playlist" data-song-id="${song.id}" aria-label="查看曲目 ${escapeHtml(song.title)}">
          <div class="playlist-song-row">
            <div style="display:flex; gap:12px; align-items:flex-start;">
              <span class="playlist-detail-song-number">${index + 1}</span>
              <div>
                <h3>${escapeHtml(song.title)}</h3>
                <div class="playlist-meta">
                  <span class="tag">调号 ${escapeHtml(song.key || "未填写")}</span>
                  <span class="tag">${escapeHtml(renderLevel(song.level))}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="member-list">
            <span class="member-tag">${escapeHtml(bandSummary)}</span>
          </div>
        </article>
      `;
    }

    function handleSongActions(event) {
      const { action, id, songId, scene } = event.currentTarget.dataset;

      if (action === "view-song") {
        state.selectedSongId = id;
        state.viewingBandScene = "withDrums";
        if (window.innerWidth <= 960) {
          state.songMobileView = "detail";
        }
        renderSongList();
        renderSongDetail();
        syncMobileLayout();
        return;
      }

      if (action === "edit-song") {
        openSongModal(findSong(id));
        return;
      }

      if (action === "delete-song") {
        deleteSong(id);
        return;
      }

      if (action === "switch-band-scene") {
        state.viewingBandScene = scene || "withDrums";
        renderSongDetail();
        return;
      }

      if (action === "edit-lyrics") {
        toggleLyricsEditor(true);
        return;
      }

      if (action === "cancel-lyrics") {
        toggleLyricsEditor(false);
        return;
      }

      if (action === "save-lyrics") {
        saveLyrics(songId);
      }
    }

    function handlePlaylistActions(event) {
      const { action, id, songId } = event.currentTarget.dataset;

      if (action === "view-playlist") {
        state.selectedPlaylistId = id;
        if (window.innerWidth <= 960) {
          state.playlistMobileView = "detail";
        }
        renderPlaylistList();
        renderPlaylistDetail();
        syncMobileLayout();
        return;
      }

      if (action === "edit-playlist") {
        openPlaylistModal(findPlaylist(id));
        return;
      }

      if (action === "delete-playlist") {
        deletePlaylist(id);
        return;
      }

      if (action === "open-song-from-playlist") {
        state.module = "songs";
        state.selectedSongId = songId;
        state.viewingBandScene = "withDrums";
        if (window.innerWidth <= 960) {
          state.songMobileView = "detail";
        }
        render();
      }
    }

    function handleSongSubmit(event) {
      event.preventDefault();
      const id = document.getElementById("song-id").value || createId();
      const existing = findSong(id);
      const song = {
        id,
        title: document.getElementById("song-title").value.trim(),
        key: document.getElementById("song-key").value.trim(),
        level: Number(document.getElementById("song-level").value),
        chartLink: document.getElementById("song-chart").value.trim(),
        bandSetup: readBandSetupFromSongForm(state.editingBandSetupScenes),
        chordProgression: existing ? existing.chordProgression || "" : "",
        lyrics: existing ? existing.lyrics || DEFAULT_LYRICS_TEMPLATE : DEFAULT_LYRICS_TEMPLATE
      };

      if (!song.title) {
        return;
      }

      if (existing) {
        Object.assign(existing, song);
      } else {
        state.songs.unshift(song);
        state.selectedSongId = song.id;
      }

      persistSongs();
      closeModal("song-modal");
      render();
    }

    function handlePlaylistSubmit(event) {
      event.preventDefault();
      const id = document.getElementById("playlist-id").value || createId();
      const existing = findPlaylist(id);
      const playlist = {
        id,
        name: document.getElementById("playlist-name").value.trim(),
        scene: document.getElementById("playlist-scene").value,
        notes: document.getElementById("playlist-notes").value.trim(),
        songIds: state.playlistDraftSongIds.filter((songId, index, list) => list.indexOf(songId) === index)
      };

      if (!playlist.name) {
        return;
      }

      if (existing) {
        Object.assign(existing, playlist);
      } else {
        state.playlists.unshift(playlist);
        state.selectedPlaylistId = playlist.id;
      }

      persistPlaylists();
      closeModal("playlist-modal");
      render();
    }

    function openSongModal(song) {
      document.getElementById("song-modal-title").textContent = song ? "编辑曲目" : "新增曲目";
      document.getElementById("song-id").value = song?.id || "";
      document.getElementById("song-title").value = song?.title || "";
      document.getElementById("song-key").value = song?.key || "";
      document.getElementById("song-level").value = String(normalizeLevel(song?.level || 2));
      document.getElementById("song-chart").value = song?.chartLink || "";
      state.editingBandScene = "withDrums";
      state.editingBandSetupScenes = normalizeBandSetupScenes(song?.bandSetup || createDefaultBandSetupScenes());
      applyBandSetupToSongForm(state.editingBandSetupScenes);
      openModal("song-modal");
      setTimeout(() => document.getElementById("song-title").focus(), 30);
    }

    function openPlaylistModal(playlist) {
      document.getElementById("playlist-modal-title").textContent = playlist ? "编辑歌单" : "新建歌单";
      document.getElementById("playlist-id").value = playlist?.id || "";
      document.getElementById("playlist-name").value = playlist?.name || "";
      document.getElementById("playlist-scene").value = playlist?.scene || "路边演出";
      document.getElementById("playlist-notes").value = playlist?.notes || "";
      state.playlistDraftSongIds = playlist ? [...playlist.songIds] : [];
      renderPlaylistBuilder();
      openModal("playlist-modal");
      setTimeout(() => document.getElementById("playlist-name").focus(), 30);
    }

    function renderPlaylistBuilder() {
      if (state.songs.length === 0) {
        elements.playlistSongOptions.innerHTML = `<p class="muted">请先在曲目模块创建曲目，再来建歌单。</p>`;
        elements.playlistSelectedList.innerHTML = `<p class="muted">暂无可选曲目。</p>`;
        return;
      }

      elements.playlistSongOptions.innerHTML = state.songs.map((song) => `
        <div class="playlist-song-option">
          <label>
            <input type="checkbox" data-playlist-song-toggle="${song.id}" ${state.playlistDraftSongIds.includes(song.id) ? "checked" : ""}>
            <div>
              <strong>${escapeHtml(song.title)}</strong>
              <div class="playlist-meta">
                <span class="tag">调号 ${escapeHtml(song.key || "未填写")}</span>
                <span class="tag">${escapeHtml(renderLevel(song.level))}</span>
              </div>
            </div>
          </label>
        </div>
      `).join("");

      const selectedSongs = state.playlistDraftSongIds
        .map((songId) => findSong(songId))
        .filter(Boolean);

      elements.playlistSelectedList.innerHTML = selectedSongs.length
        ? selectedSongs.map((song, index) => `
          <div class="playlist-draft-item">
            <div class="toolbar">
              <strong>${index + 1}. ${escapeHtml(song.title)}</strong>
              <div class="playlist-order-actions">
                <button class="mini-btn" type="button" data-playlist-move="up" data-song-id="${song.id}" ${index === 0 ? "disabled" : ""}>上移</button>
                <button class="mini-btn" type="button" data-playlist-move="down" data-song-id="${song.id}" ${index === selectedSongs.length - 1 ? "disabled" : ""}>下移</button>
                <button class="mini-btn" type="button" data-playlist-remove="${song.id}">移除</button>
              </div>
            </div>
            <div class="playlist-meta">
              <span class="tag">调号 ${escapeHtml(song.key || "未填写")}</span>
              <span class="tag">${escapeHtml(renderLevel(song.level))}</span>
            </div>
          </div>
        `).join("")
        : `<p class="muted">还没有加入曲目。</p>`;

      elements.playlistSongOptions.querySelectorAll("[data-playlist-song-toggle]").forEach((input) => {
        input.addEventListener("change", () => togglePlaylistDraftSong(input.dataset.playlistSongToggle, input.checked));
      });
      elements.playlistSelectedList.querySelectorAll("[data-playlist-move]").forEach((button) => {
        button.addEventListener("click", () => movePlaylistDraftSong(button.dataset.songId, button.dataset.playlistMove));
      });
      elements.playlistSelectedList.querySelectorAll("[data-playlist-remove]").forEach((button) => {
        button.addEventListener("click", () => removePlaylistDraftSong(button.dataset.playlistRemove));
      });
    }

    function togglePlaylistDraftSong(songId, checked) {
      if (checked) {
        if (!state.playlistDraftSongIds.includes(songId)) {
          state.playlistDraftSongIds.push(songId);
        }
      } else {
        state.playlistDraftSongIds = state.playlistDraftSongIds.filter((id) => id !== songId);
      }
      renderPlaylistBuilder();
    }

    function movePlaylistDraftSong(songId, direction) {
      const index = state.playlistDraftSongIds.indexOf(songId);
      if (index < 0) {
        return;
      }
      const nextIndex = direction === "up" ? index - 1 : index + 1;
      if (nextIndex < 0 || nextIndex >= state.playlistDraftSongIds.length) {
        return;
      }
      const draft = [...state.playlistDraftSongIds];
      [draft[index], draft[nextIndex]] = [draft[nextIndex], draft[index]];
      state.playlistDraftSongIds = draft;
      renderPlaylistBuilder();
    }

    function removePlaylistDraftSong(songId) {
      state.playlistDraftSongIds = state.playlistDraftSongIds.filter((id) => id !== songId);
      renderPlaylistBuilder();
    }

    function deleteSong(songId) {
      const song = findSong(songId);
      const relatedPlaylists = state.playlists.filter((playlist) => playlist.songIds.includes(songId));
      const prompt = relatedPlaylists.length
        ? `曲目“${song?.title || ""}”存在于 ${relatedPlaylists.length} 个歌单中，删除后会自动从这些歌单移除。确认继续吗？`
        : `确认删除曲目“${song?.title || ""}”？`;
      if (!window.confirm(prompt)) {
        return;
      }

      state.songs = state.songs.filter((item) => item.id !== songId);
      state.playlists.forEach((playlist) => {
        playlist.songIds = playlist.songIds.filter((id) => id !== songId);
      });

      if (state.selectedSongId === songId) {
        state.selectedSongId = state.songs[0]?.id || null;
        state.songMobileView = state.selectedSongId ? "detail" : "list";
      }

      persistSongs();
      persistPlaylists();
      render();
    }

    function deletePlaylist(playlistId) {
      const playlist = findPlaylist(playlistId);
      if (!window.confirm(`确认删除歌单“${playlist?.name || ""}”？`)) {
        return;
      }

      state.playlists = state.playlists.filter((item) => item.id !== playlistId);
      if (state.selectedPlaylistId === playlistId) {
        state.selectedPlaylistId = state.playlists[0]?.id || null;
        state.playlistMobileView = state.selectedPlaylistId ? "detail" : "list";
      }
      persistPlaylists();
      render();
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove("hidden");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.add("hidden");
      modal.setAttribute("aria-hidden", "true");

      if (id === "song-modal") {
        state.editingBandScene = "withDrums";
        state.editingBandSetupScenes = createDefaultBandSetupScenes();
        elements.songForm.reset();
        document.getElementById("song-id").value = "";
      }

      if (id === "playlist-modal") {
        state.playlistDraftSongIds = [];
        elements.playlistForm.reset();
        document.getElementById("playlist-id").value = "";
      }
    }

    function getFilteredSongs() {
      if (!state.songSearch) {
        return state.songs;
      }

      return state.songs.filter((song) => song.title.toLowerCase().includes(state.songSearch));
    }

    function groupSongsByInitial(songs) {
      const grouped = new Map();
      songs.forEach((song) => {
        const initial = getSongInitial(song.title);
        if (!grouped.has(initial)) {
          grouped.set(initial, []);
        }
        grouped.get(initial).push(song);
      });

      return Array.from(grouped.entries())
        .sort(([left], [right]) => compareInitials(left, right))
        .map(([initial, groupSongs]) => ({
          initial,
          songs: groupSongs.sort((left, right) => left.title.localeCompare(right.title, "zh-Hans-CN"))
        }));
    }

    function getSongInitial(title) {
      const value = String(title || "").trim();
      if (!value) {
        return "#";
      }
      const firstChar = value[0];
      if (/[A-Za-z]/.test(firstChar)) {
        return firstChar.toUpperCase();
      }
      if (/[0-9]/.test(firstChar)) {
        return "#";
      }
      return getChinesePinyinInitial(firstChar) || "#";
    }

    function getChinesePinyinInitial(char) {
      const boundaries = [
        ["A", "阿"], ["B", "芭"], ["C", "擦"], ["D", "搭"], ["E", "蛾"],
        ["F", "发"], ["G", "噶"], ["H", "哈"], ["J", "击"], ["K", "喀"],
        ["L", "垃"], ["M", "妈"], ["N", "拿"], ["O", "哦"], ["P", "啪"],
        ["Q", "期"], ["R", "然"], ["S", "撒"], ["T", "塌"], ["W", "挖"],
        ["X", "昔"], ["Y", "压"], ["Z", "匝"]
      ];
      for (let index = boundaries.length - 1; index >= 0; index -= 1) {
        const [letter, boundary] = boundaries[index];
        if (char.localeCompare(boundary, "zh-Hans-CN") >= 0) {
          return letter;
        }
      }
      return "";
    }

    function compareInitials(left, right) {
      if (left === "#" && right === "#") {
        return 0;
      }
      if (left === "#") {
        return -1;
      }
      if (right === "#") {
        return 1;
      }
      return left.localeCompare(right, "en");
    }

    function bindCardAction(element, handler) {
      element.addEventListener("click", handler);
      element.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          handler({ currentTarget: element });
        }
      });
    }

    function toggleLyricsEditor(shouldOpen) {
      const preview = document.getElementById("lyrics-preview-wrap");
      const editor = document.getElementById("lyrics-editor-wrap");
      if (!preview || !editor) {
        return;
      }
      preview.classList.toggle("hidden", shouldOpen);
      editor.classList.toggle("hidden", !shouldOpen);
      if (shouldOpen) {
        const input = document.getElementById("chord-input");
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }
    }

    function saveLyrics(songId) {
      const song = findSong(songId);
      const chordInput = document.getElementById("chord-input");
      const lyricsInput = document.getElementById("lyrics-input");
      if (!song || !chordInput || !lyricsInput) {
        return;
      }
      song.chordProgression = normalizeMultilineText(chordInput.value).trim();
      song.lyrics = normalizeMultilineText(lyricsInput.value);
      persistSongs();
      renderSongDetail();
    }

    function readBandSetupFromSongForm(existingScenes = state.editingBandSetupScenes) {
      const scenes = normalizeBandSetupScenes(existingScenes);
      scenes[state.editingBandScene] = {
        vocals: getCheckedValues("song-vocals"),
        guitars: getCheckedValues("song-guitars"),
        bass: getSelectValue("song-bass"),
        drum: getSelectValue("song-drum"),
        keyboard: getSelectValue("song-keyboard")
      };
      return normalizeBandSetupScenes(scenes);
    }

    function applyBandSetupToSongForm(bandSetupScenes) {
      const scenes = normalizeBandSetupScenes(bandSetupScenes);
      const current = scenes[state.editingBandScene];

      setCheckedValues("song-vocals", current.vocals);
      setCheckedValues("song-guitars", current.guitars);
      updatePickerLabel("song-vocal-toggle", "song-vocals", "请选择 vocal");
      updatePickerLabel("song-guitar-toggle", "song-guitars", "请选择 guitar");
      setSelectValue("song-bass", current.bass);
      setSelectValue("song-drum", current.drum);
      setSelectValue("song-keyboard", current.keyboard);
      syncBandSceneButtons();
      syncDrumOptions();
    }

    function renderBandSetupTabs(bandSetupScenes) {
      const scenes = normalizeBandSetupScenes(bandSetupScenes);
      const currentScene = scenes[state.viewingBandScene] ? state.viewingBandScene : "withDrums";
      return `
        <div class="scene-tabs">
          ${Object.entries(BAND_SCENES).map(([sceneKey, sceneLabel]) => `
            <button type="button" class="scene-tab${sceneKey === currentScene ? " active" : ""}" data-action="switch-band-scene" data-scene="${sceneKey}">
              ${sceneLabel}
            </button>
          `).join("")}
        </div>
        <div class="member-list">${renderBandSetupTags(scenes[currentScene])}</div>
      `;
    }

    function renderBandSetupTags(setup) {
      const normalized = normalizeBandSetup(setup, true);
      const entries = [
        `vocal: ${normalized.vocals.length ? normalized.vocals.join("、") : "无"}`,
        `guitar: ${normalized.guitars.length ? normalized.guitars.join("、") : "无"}`,
        `bass: ${normalized.bass || "无"}`,
        `drum: ${normalized.drum || "无"}`,
        `keyboard: ${normalized.keyboard || "无"}`
      ];
      return entries.map((item) => `<span class="member-tag">${escapeHtml(item)}</span>`).join("");
    }

    function summarizeBandSetup(setup) {
      const normalized = normalizeBandSetup(setup, true);
      const vocal = normalized.vocals.length ? normalized.vocals.join("、") : "无";
      const guitar = normalized.guitars.length ? normalized.guitars.join("、") : "无";
      return `vocal ${vocal} · guitar ${guitar}`;
    }

    function normalizeBandSetupScenes(bandSetupScenes) {
      if (bandSetupScenes?.withDrums || bandSetupScenes?.withoutDrums) {
        return {
          withDrums: normalizeBandSetup(bandSetupScenes.withDrums, false),
          withoutDrums: normalizeBandSetup(bandSetupScenes.withoutDrums, true)
        };
      }

      const legacy = normalizeBandSetup(bandSetupScenes, false);
      return {
        withDrums: legacy,
        withoutDrums: {
          ...legacy,
          vocals: [...legacy.vocals],
          guitars: [...legacy.guitars],
          drum: ""
        }
      };
    }

    function normalizeBandSetup(setup, allowNoDrum = false) {
      if (setup) {
        return {
          vocals: Array.isArray(setup.vocals)
            ? setup.vocals
            : Array.isArray(setup.vocalists)
              ? setup.vocalists
              : [...DEFAULT_BAND_SETUP.vocals],
          guitars: Array.isArray(setup.guitars)
            ? setup.guitars
            : [setup.rhythmGuitar, setup.leadGuitar].filter(Boolean),
          bass: typeof setup.bass === "string" ? setup.bass : DEFAULT_BAND_SETUP.bass,
          drum: allowNoDrum
            ? (typeof (setup.drum ?? setup.drums) === "string" ? (setup.drum ?? setup.drums) : "")
            : ((setup.drum ?? setup.drums) || DEFAULT_BAND_SETUP.drum),
          keyboard: setup.keyboard || DEFAULT_BAND_SETUP.keyboard
        };
      }
      return {
        vocals: [...DEFAULT_BAND_SETUP.vocals],
        guitars: [...DEFAULT_BAND_SETUP.guitars],
        bass: DEFAULT_BAND_SETUP.bass,
        drum: allowNoDrum ? "" : DEFAULT_BAND_SETUP.drum,
        keyboard: DEFAULT_BAND_SETUP.keyboard
      };
    }

    function createDefaultBandSetupScenes() {
      return normalizeBandSetupScenes(null);
    }

    function bindBandSceneSwitch() {
      document.querySelectorAll(".scenario-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const nextScene = button.dataset.scene;
          if (!nextScene || nextScene === state.editingBandScene) {
            return;
          }
          state.editingBandSetupScenes = readBandSetupFromSongForm(state.editingBandSetupScenes);
          state.editingBandScene = nextScene;
          applyBandSetupToSongForm(state.editingBandSetupScenes);
        });
      });
    }

    function syncBandSceneButtons() {
      document.querySelectorAll(".scenario-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.scene === state.editingBandScene);
      });
    }

    function syncDrumOptions() {
      const drumSelect = document.getElementById("song-drum");
      if (!drumSelect) {
        return;
      }
      const allowEmpty = state.editingBandScene === "withoutDrums";
      const emptyOption = drumSelect.querySelector('option[value=""]');
      if (emptyOption) {
        emptyOption.hidden = !allowEmpty;
      }
      if (!allowEmpty && !drumSelect.value) {
        drumSelect.value = DEFAULT_BAND_SETUP.drum;
      }
    }

    function bindMultiPicker(toggleId, panelId, inputName, placeholder) {
      const toggle = document.getElementById(toggleId);
      const panel = document.getElementById(panelId);
      if (!toggle || !panel) {
        return;
      }

      toggle.addEventListener("click", () => {
        const isOpen = !panel.classList.contains("hidden");
        panel.classList.toggle("hidden", isOpen);
        toggle.setAttribute("aria-expanded", String(!isOpen));
      });

      document.querySelectorAll(`input[name="${inputName}"]`).forEach((input) => {
        input.addEventListener("change", () => updatePickerLabel(toggleId, inputName, placeholder));
      });

      document.addEventListener("click", (event) => {
        if (!panel.contains(event.target) && !toggle.contains(event.target)) {
          panel.classList.add("hidden");
          toggle.setAttribute("aria-expanded", "false");
        }
      });

      updatePickerLabel(toggleId, inputName, placeholder);
    }

    function updatePickerLabel(toggleId, inputName, placeholder) {
      const toggle = document.getElementById(toggleId);
      const text = toggle?.querySelector(".picker-toggle-text");
      if (!toggle || !text) {
        return;
      }
      const values = getCheckedValues(inputName);
      text.textContent = values.length ? values.join("、") : placeholder;
    }

    function getCheckedValues(name) {
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map((input) => input.value);
    }

    function setCheckedValues(name, values) {
      document.querySelectorAll(`input[name="${name}"]`).forEach((input) => {
        input.checked = values.includes(input.value);
      });
    }

    function getSelectValue(id) {
      const element = document.getElementById(id);
      return element ? element.value : "";
    }

    function setSelectValue(id, value) {
      const element = document.getElementById(id);
      if (element) {
        element.value = value;
      }
    }

    function loadSongs() {
      try {
        const stored = localStorage.getItem(SONG_STORAGE_KEY) || localStorage.getItem(SONG_STORAGE_FALLBACK_KEY);
        if (!stored) {
          return [];
        }
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) {
          return [];
        }
        return parsed.map((song) => ({
          id: song.id || createId(),
          title: song.title || "",
          key: song.key || "",
          level: normalizeLevel(song.level),
          chartLink: song.chartLink || "",
          bandSetup: normalizeBandSetupScenes(song.bandSetup),
          chordProgression: normalizeMultilineText(song.chordProgression || song.lyricsChords || ""),
          lyrics: normalizeMultilineText(song.lyrics || (song.lyricsChords ? DEFAULT_LYRICS_TEMPLATE : ""))
        }));
      } catch (error) {
        console.error("Failed to load songs", error);
        return [];
      }
    }

    function loadPlaylists() {
      try {
        const stored = localStorage.getItem(PLAYLIST_STORAGE_KEY);
        if (!stored) {
          return [];
        }
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) {
          return [];
        }
        return parsed.map((playlist) => ({
          id: playlist.id || createId(),
          name: playlist.name || "",
          scene: playlist.scene || "路边演出",
          notes: playlist.notes || "",
          songIds: Array.isArray(playlist.songIds) ? playlist.songIds : []
        }));
      } catch (error) {
        console.error("Failed to load playlists", error);
        return [];
      }
    }

    function persistSongs() {
      localStorage.setItem(SONG_STORAGE_KEY, JSON.stringify(state.songs));
      localStorage.setItem(SONG_STORAGE_FALLBACK_KEY, JSON.stringify(state.songs));
    }

    function persistPlaylists() {
      localStorage.setItem(PLAYLIST_STORAGE_KEY, JSON.stringify(state.playlists));
    }

    function normalizeMultilineText(value) {
      return String(value || "")
        .replace(/\\r\\n/g, "\n")
        .replace(/\\n/g, "\n")
        .replace(/\r\n/g, "\n");
    }

    function findSong(id) {
      return state.songs.find((song) => song.id === id) || null;
    }

    function findPlaylist(id) {
      return state.playlists.find((playlist) => playlist.id === id) || null;
    }

    function syncMobileLayout() {
      const narrow = window.innerWidth <= 960;

      if (!narrow) {
        elements.songListView.classList.remove("hidden");
        elements.songDetailView.classList.remove("hidden");
        elements.playlistListView.classList.remove("hidden");
        elements.playlistDetailView.classList.remove("hidden");
        return;
      }

      const showSongDetail = state.songMobileView === "detail" && Boolean(state.selectedSongId);
      elements.songListView.classList.toggle("hidden", showSongDetail);
      elements.songDetailView.classList.toggle("hidden", !showSongDetail);

      const showPlaylistDetail = state.playlistMobileView === "detail" && Boolean(state.selectedPlaylistId);
      elements.playlistListView.classList.toggle("hidden", showPlaylistDetail);
      elements.playlistDetailView.classList.toggle("hidden", !showPlaylistDetail);
    }

    function normalizeLevel(level) {
      const numeric = Number(level);
      if (numeric >= 5) {
        return 4;
      }
      if (numeric >= 4) {
        return 3;
      }
      if (numeric >= 2) {
        return 2;
      }
      return 1;
    }

    function renderLevel(level) {
      return LEVEL_LABELS[normalizeLevel(level)] || LEVEL_LABELS[1];
    }

    function createId() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }
  </script>
</body>
