            <button class="page-action-btn" type="button" data-action="return-to-playlist">返回歌单</button>
          </div>
        `
        : "";

      elements.songDetailContent.innerHTML = `
        ${playlistReturnBar}
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>${escapeHtml(song.title)}</h2>
              <p class="muted">曲目信息</p>
            </div>
            <div class="inline-actions">
              <button class="page-action-btn" type="button" data-action="edit-song" data-id="${song.id}" aria-label="编辑曲目" title="编辑曲目">🖊️ 编辑</button>
              <button class="page-action-btn danger" type="button" data-action="delete-song" data-id="${song.id}" aria-label="删除曲目" title="删除曲目">🗑️ 删除</button>
            </div>
          </div>
        </section>
        <section class="summary-card">
          <div class="detail-content-grid">
            <article class="detail-info-card">
              <div class="detail-card-title">曲名</div>
              <div class="detail-card-body">${escapeHtml(song.title)}</div>
            </article>
            <article class="detail-info-card">
              <div class="detail-card-title">调号</div>
              <div class="detail-card-body">${escapeHtml(song.key || "未填写")}</div>
            </article>
            <article class="detail-info-card">
              <div class="detail-card-title">熟练度</div>
              <div class="detail-card-body">${escapeHtml(renderLevel(song.level))}</div>
            </article>
            <article class="detail-info-card full-span">
              <div class="detail-card-head">
                <div class="detail-card-title">谱子</div>
              </div>
              <div class="detail-card-body">${renderSongResourcesContent(song, resources)}</div>
            </article>
            <article class="detail-info-card full-span">
              <div class="detail-card-title">歌词与和弦</div>
              <div class="detail-card-body">
                <div class="lyrics-preview-grid">
                  <div>
                    <p class="info-label">和弦走向</p>
                    ${chordsPreview}
                  </div>
                  <div>
                    <p class="info-label">歌词</p>
                    ${lyricsPreview}
                  </div>
                </div>
              </div>
            </article>
          </div>
        </section>
      `;

      elements.songDetailContent.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", handleSongActions);
      });
    }

    function renderSongResourcesContent(song, resources) {
      if (!resources.length) {
        return `
          <div class="detail-empty compact-empty">
            <div>
              <p>还没有资料。</p>
            </div>
          </div>
        `;
      }

      return `
        <div class="resource-groups">
          ${resources.map((resource) => renderResourceCard(song.id, resource)).join("")}
        </div>
      `;
    }

    function renderResourceCard(songId, resource) {
      return `
        <article class="resource-card">
          <div class="resource-card-head">
            <div class="resource-card-title">${escapeHtml(resource.title)}</div>
            <div class="resource-card-actions compact">
              <a class="resource-open-link compact-link" href="${escapeAttribute(resource.url)}" target="_blank" rel="noreferrer">打开</a>
            </div>
          </div>
          <div class="resource-card-link">${escapeHtml(resource.url)}</div>
          ${resource.note ? `<p class="resource-note">${escapeHtml(resource.note)}</p>` : ""}
        </article>
      `;
    }

    function renderSongModalResources() {
      if (!elements.songModalResources) {
        return;
      }

      if (!state.songDraftResources.length) {
        elements.songModalResources.innerHTML = `
          <div class="resource-editor-empty">
            还没有添加资料。<br>可以直接在这里维护多条谱子、视频或参考链接。
          </div>
        `;
        return;
      }

      elements.songModalResources.innerHTML = state.songDraftResources.map((resource) => `
        <article class="resource-card">
          <div class="resource-card-head">
            <div class="resource-card-title">${escapeHtml(resource.title)}</div>
            <div class="resource-card-actions compact">
              <button class="resource-mini-icon-btn" type="button" data-song-modal-action="edit-resource" data-id="${resource.id}" aria-label="编辑资料" title="编辑资料">✎<span class="btn-label">编辑</span></button>
              <button class="resource-mini-icon-btn danger" type="button" data-song-modal-action="delete-resource" data-id="${resource.id}" aria-label="删除资料" title="删除资料">🗑<span class="btn-label">删除</span></button>
            </div>
          </div>
          <div class="resource-card-link">${escapeHtml(resource.url)}</div>
          ${resource.note ? `<p class="resource-note">${escapeHtml(resource.note)}</p>` : ""}
        </article>
      `).join("");
    }

    function renderPlaylistList() {
      elements.playlistCount.textContent = `共 ${state.playlists.length} 个歌单`;
      elements.playlistEmpty.classList.toggle("hidden", state.playlists.length !== 0);
      elements.playlistList.innerHTML = "";

      if (state.playlists.length === 0) {
        return;
      }

      state.playlists.forEach((playlist) => {
        const songs = playlist.songIds.map(findSong).filter(Boolean);
        const card = document.createElement("article");
        card.className = `clickable-card${playlist.id === state.selectedPlaylistId ? " active" : ""}`;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `查看歌单 ${playlist.name}`);
        card.dataset.action = "view-playlist";
        card.dataset.id = playlist.id;
        card.innerHTML = `
          <div class="playlist-title-row">
            <h3>${escapeHtml(playlist.name)}</h3>
          </div>
          <div class="playlist-meta">
            <span class="tag">${songs.length} 首曲目</span>
          </div>
          <p class="playlist-notes notes-preview">${escapeHtml(playlist.notes || "暂无备注")}</p>
        `;
        elements.playlistList.appendChild(card);
      });

      elements.playlistList.querySelectorAll('.clickable-card[data-action="view-playlist"]').forEach((card) => {
        bindCardAction(card, handlePlaylistActions);
      });
    }

    function renderPlaylistDetail() {
      const playlist = findPlaylist(state.selectedPlaylistId);
      if (!playlist) {
        elements.playlistDetailContent.innerHTML = `
          <div class="detail-empty">
            <div>
              <h3>选择一个歌单查看详情</h3>
              <p>你可以从左侧列表进入，或先新建歌单。</p>
            </div>
          </div>
        `;
        return;
      }

      const songs = playlist.songIds.map(findSong).filter(Boolean);
      elements.playlistDetailContent.innerHTML = `
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>${escapeHtml(playlist.name)}</h2>
              <p class="muted">${songs.length} 首曲目</p>
            </div>
            <div class="inline-actions">
              <button class="page-action-btn" type="button" data-action="edit-playlist" data-id="${playlist.id}" aria-label="编辑歌单" title="编辑歌单">🖊️ 编辑</button>
              <button class="page-action-btn danger" type="button" data-action="delete-playlist" data-id="${playlist.id}" aria-label="删除歌单" title="删除歌单">🗑️ 删除</button>
            </div>
          </div>
        </section>
        <section class="summary-card info-grid">
          <div>
            <p class="info-label">歌单名称</p>
            <p class="info-value">${escapeHtml(playlist.name)}</p>
          </div>
          <div class="full-span">
            <p class="info-label">备注</p>
            <p class="info-value">${escapeHtml(playlist.notes || "暂无备注")}</p>
          </div>
        </section>
        <section class="summary-card">
          <div class="detail-header">
            <div>
              <h2>曲目清单</h2>
              <p class="muted">点击单曲可进入曲目详情，适合排练和演出时快速查看。</p>
            </div>
          </div>
          <div class="playlist-detail-list">
            ${songs.length ? songs.map((song, index) => renderPlaylistSongDetailItem(song, index)).join("") : `<div class="detail-empty"><p>这个歌单里还没有曲目。</p></div>`}
          </div>
        </section>
      `;

      elements.playlistDetailContent.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", handlePlaylistActions);
      });
      elements.playlistDetailContent.querySelectorAll('[data-action="open-song-from-playlist"]').forEach((card) => {
        bindCardAction(card, handlePlaylistActions);
      });
    }

    function renderPlaylistSongDetailItem(song, index) {
      return `
        <article class="playlist-detail-song" tabindex="0" role="button" data-action="open-song-from-playlist" data-song-id="${song.id}" aria-label="查看曲目 ${escapeHtml(song.title)}">
          <div class="playlist-song-row">
            <div class="playlist-song-main">
              <div class="playlist-song-top">
              <span class="playlist-detail-song-number">${index + 1}</span>
                <div>
                <h3>${escapeHtml(song.title)}</h3>
                </div>
              </div>
              <div class="playlist-meta">
                <span class="tag">调号 ${escapeHtml(song.key || "未填写")}</span>
                <span class="tag">${escapeHtml(renderLevel(song.level))}</span>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function handleSongActions(event) {
      const { action, id, songId, scene } = event.currentTarget.dataset;

      if (action === "view-song") {
        state.songDetailSource = "songs";
        state.selectedSongId = id;
        if (window.innerWidth <= 960) {
          state.songMobileView = "detail";
        }
        renderSongList();
        renderSongDetail();
        syncMobileLayout();
        return;
      }

      if (action === "edit-song") {
        openSongModal(findSong(id));
        return;
      }

      if (action === "delete-song") {
        deleteSong(id);
        return;
      }

      if (action === "return-to-playlist") {
        state.module = "playlists";
        state.playlistMobileView = "detail";
        renderModuleTabs();
        renderModuleViews();
        syncMobileLayout();
        return;
      }

      if (action === "add-resource") {
        openResourceModal(songId);
        return;
      }

      if (action === "edit-resource") {
        openResourceModal(songId, getSongResource(songId, id));
        return;
      }

      if (action === "delete-resource") {
        deleteResource(songId, id);
        return;
      }

    }

    function handlePlaylistActions(event) {
      const { action, id, songId } = event.currentTarget.dataset;

      if (action === "view-playlist") {
        state.selectedPlaylistId = id;
        if (window.innerWidth <= 960) {
          state.playlistMobileView = "detail";
        }
        renderPlaylistList();
        renderPlaylistDetail();
        syncMobileLayout();
        return;
      }

      if (action === "edit-playlist") {
        openPlaylistModal(findPlaylist(id));
        return;
      }

      if (action === "delete-playlist") {
        deletePlaylist(id);
        return;
      }

      if (action === "open-song-from-playlist") {
        state.module = "songs";
        state.songDetailSource = "playlist";
        state.selectedSongId = songId;
        if (window.innerWidth <= 960) {
          state.songMobileView = "detail";
        }
        render();
      }
    }

    function handleSongModalResourceActions(event) {
      const actionTarget = event.target.closest("[data-song-modal-action]");
      if (!actionTarget) {
        return;
      }

      const { songModalAction, id } = actionTarget.dataset;
      const resource = state.songDraftResources.find((item) => item.id === id);

      if (songModalAction === "edit-resource" && resource) {
        openResourceModal(null, resource, "song-modal");
        return;
      }

      if (songModalAction === "delete-resource" && resource) {
        if (!window.confirm(`确认删除资料“${resource.title}”？`)) {
          return;
        }
        state.songDraftResources = state.songDraftResources.filter((item) => item.id !== id);
        renderSongModalResources();
      }
    }

    async function handleSongSubmit(event) {
      event.preventDefault();
      const id = document.getElementById("song-id").value || createId();
      const existing = findSong(id);
      const song = {
        id,
        title: document.getElementById("song-title").value.trim(),
        key: document.getElementById("song-key").value.trim(),
        level: Number(document.getElementById("song-level").value),
        chartLink: "",
        resources: state.songDraftResources.map((resource, index) => normalizeResourceItem(resource, index)),
        chordProgression: normalizeMultilineText(document.getElementById("song-modal-chord").value).trim(),
        lyrics: normalizeMultilineText(document.getElementById("song-modal-lyrics").value || DEFAULT_LYRICS_TEMPLATE)
      };

      if (!song.title) {
        return;
      }

      if (existing) {
        Object.assign(existing, song);
      } else {
        state.songs.unshift(song);
      }
      state.selectedSongId = song.id;
      await saveRemoteData();
      closeModal("song-modal");
      render();
    }

    async function handlePlaylistSubmit(event) {
      event.preventDefault();
      const id = document.getElementById("playlist-id").value || createId();
      const existing = findPlaylist(id);
      const playlist = {
        id,
        name: document.getElementById("playlist-name").value.trim(),
        notes: document.getElementById("playlist-notes").value.trim(),
        songIds: state.playlistDraftSongIds.filter((songId, index, list) => list.indexOf(songId) === index)
      };

      if (!playlist.name) {
        return;
      }

      if (existing) {
        Object.assign(existing, playlist);
      } else {
        state.playlists.unshift(playlist);
      }
      state.selectedPlaylistId = playlist.id;
      await saveRemoteData();
      closeModal("playlist-modal");
      render();
    }

    async function handleResourceSubmit(event) {
      event.preventDefault();
      const context = document.getElementById("resource-context").value || "detail";
      const songId = document.getElementById("resource-song-id").value;
      const resourceId = document.getElementById("resource-id").value || createId();
      const nextResource = {
        id: resourceId,
        role: "",
        title: document.getElementById("resource-title").value.trim(),
        type: "其他",
        url: document.getElementById("resource-url").value.trim(),
        note: document.getElementById("resource-note").value.trim()
      };

      if (!nextResource.title || !nextResource.url) {
        return;
      }

      if (context === "song-modal") {
        state.songDraftResources = state.songDraftResources.filter((resource) => resource.id !== resourceId);
        state.songDraftResources.push(nextResource);
        closeModal("resource-modal");
        renderSongModalResources();
        return;
      }

      const song = findSong(songId);
      if (!song) {
        return;
      }

      const editingResource = getSongResource(songId, resourceId);
      if (editingResource?.legacySource === "chartLink") {
        song.chartLink = "";
      }

      song.resources = normalizeSongResources(song).filter((resource) => resource.id !== resourceId && resource.legacySource !== "chartLink");
      song.resources.push(nextResource);
      song.resources = syncLegacyChartLinkResource(song.resources, song.chartLink);
      await saveRemoteData();
      closeModal("resource-modal");
      renderSongDetail();
    }

    function openSongModal(song) {
      document.getElementById("song-modal-title").textContent = song ? "编辑曲目" : "新增曲目";
      document.getElementById("song-id").value = song?.id || "";
      document.getElementById("song-title").value = song?.title || "";
      document.getElementById("song-key").value = song?.key || "";
      document.getElementById("song-level").value = String(normalizeLevel(song?.level || 2));
      document.getElementById("song-modal-chord").value = song?.chordProgression || "";
      document.getElementById("song-modal-lyrics").value = song?.lyrics || DEFAULT_LYRICS_TEMPLATE;
      state.songDraftResources = normalizeSongResources(song || {}).map((resource, index) => normalizeResourceItem(resource, index));
      renderSongModalResources();
      openModal("song-modal");
      setTimeout(() => document.getElementById("song-title").focus(), 30);
    }

    function openResourceModal(songId, resource, context = "detail") {
      document.getElementById("resource-modal-title").textContent = resource ? "编辑资料" : "新增资料";
      document.getElementById("resource-context").value = context;
      document.getElementById("resource-song-id").value = songId;
      document.getElementById("resource-id").value = resource?.id || "";
      document.getElementById("resource-title").value = resource?.title || "";
      document.getElementById("resource-url").value = resource?.url || "";
      document.getElementById("resource-note").value = resource?.note || "";
      openModal("resource-modal");
      setTimeout(() => document.getElementById("resource-title").focus(), 30);
    }

    function openPlaylistModal(playlist) {
      document.getElementById("playlist-modal-title").textContent = playlist ? "编辑歌单" : "新建歌单";
      document.getElementById("playlist-id").value = playlist?.id || "";
      document.getElementById("playlist-name").value = playlist?.name || "";
      document.getElementById("playlist-notes").value = playlist?.notes || "";
      state.playlistSongSearch = "";
      if (elements.playlistSongSearch) {
        elements.playlistSongSearch.value = "";
      }
      state.playlistDraftSongIds = playlist ? [...playlist.songIds] : [];
      renderPlaylistBuilder();
      openModal("playlist-modal");
      setTimeout(() => document.getElementById("playlist-name").focus(), 30);
    }

    function renderPlaylistBuilder() {
      if (state.songs.length === 0) {
        elements.playlistSongOptions.innerHTML = `<p class="muted">请先在曲目模块创建曲目，再来建歌单。</p>`;
        elements.playlistSelectedList.innerHTML = `<p class="muted">暂无可选曲目。</p>`;
        return;
      }

      const filteredSongs = state.songs.filter((song) => {
        if (!state.playlistSongSearch) {
          return true;
        }
        return song.title.toLowerCase().includes(state.playlistSongSearch);
      });

      elements.playlistSongOptions.innerHTML = filteredSongs.length ? filteredSongs.map((song) => `
        <div class="playlist-song-option">
          <label>
            <input type="checkbox" data-playlist-song-toggle="${song.id}" ${state.playlistDraftSongIds.includes(song.id) ? "checked" : ""}>
            <span class="playlist-song-check" aria-hidden="true"></span>
            <div>
              <strong>${escapeHtml(song.title)}</strong>
              <div class="playlist-meta">
                <span class="tag">调号 ${escapeHtml(song.key || "未填写")}</span>
                <span class="tag">${escapeHtml(renderLevel(song.level))}</span>
              </div>
            </div>
          </label>
        </div>
      `).join("") : `<p class="muted">没有匹配的曲目。</p>`;

      const selectedSongs = state.playlistDraftSongIds
        .map((songId) => findSong(songId))
        .filter(Boolean);

      elements.playlistSelectedList.innerHTML = selectedSongs.length
        ? selectedSongs.map((song, index) => `
          <div class="playlist-draft-item">
            <div class="toolbar">
              <strong class="playlist-draft-title">${index + 1}. ${escapeHtml(song.title)}</strong>
              <div class="playlist-order-actions">
                <button class="mini-btn" type="button" data-playlist-move="up" data-song-id="${song.id}" ${index === 0 ? "disabled" : ""}>上移</button>
                <button class="mini-btn" type="button" data-playlist-move="down" data-song-id="${song.id}" ${index === selectedSongs.length - 1 ? "disabled" : ""}>下移</button>
                <button class="mini-btn" type="button" data-playlist-remove="${song.id}">移除</button>
              </div>
            </div>
          </div>
        `).join("")
        : `<p class="muted">还没有加入曲目。</p>`;

      elements.playlistSongOptions.querySelectorAll("[data-playlist-song-toggle]").forEach((input) => {
        input.addEventListener("change", () => togglePlaylistDraftSong(input.dataset.playlistSongToggle, input.checked));
      });
      elements.playlistSelectedList.querySelectorAll("[data-playlist-move]").forEach((button) => {
        button.addEventListener("click", () => movePlaylistDraftSong(button.dataset.songId, button.dataset.playlistMove));
      });
      elements.playlistSelectedList.querySelectorAll("[data-playlist-remove]").forEach((button) => {
        button.addEventListener("click", () => removePlaylistDraftSong(button.dataset.playlistRemove));
      });
    }

    function togglePlaylistDraftSong(songId, checked) {
      if (checked) {
        if (!state.playlistDraftSongIds.includes(songId)) {
          state.playlistDraftSongIds.push(songId);
        }
      } else {
        state.playlistDraftSongIds = state.playlistDraftSongIds.filter((id) => id !== songId);
      }
      renderPlaylistBuilder();
    }

    function movePlaylistDraftSong(songId, direction) {
      const index = state.playlistDraftSongIds.indexOf(songId);
      if (index < 0) {
        return;
      }
      const nextIndex = direction === "up" ? index - 1 : index + 1;
      if (nextIndex < 0 || nextIndex >= state.playlistDraftSongIds.length) {
        return;
      }
      const draft = [...state.playlistDraftSongIds];
      [draft[index], draft[nextIndex]] = [draft[nextIndex], draft[index]];
      state.playlistDraftSongIds = draft;
      renderPlaylistBuilder();
    }

    function removePlaylistDraftSong(songId) {
      state.playlistDraftSongIds = state.playlistDraftSongIds.filter((id) => id !== songId);
      renderPlaylistBuilder();
    }

    async function deleteResource(songId, resourceId) {
      const song = findSong(songId);
      if (!song) {
        return;
      }
      const resource = getSongResource(songId, resourceId);
      if (!window.confirm(`确认删除资料“${resource?.title || ""}”？`)) {
        return;
      }
      if (resource?.legacySource === "chartLink") {
        song.chartLink = "";
      }
      song.resources = normalizeSongResources(song).filter((item) => item.id !== resourceId && item.legacySource !== "chartLink");
      song.resources = syncLegacyChartLinkResource(song.resources, song.chartLink);
      await saveRemoteData();
      renderSongDetail();
    }

    async function deleteSong(songId) {
      const song = findSong(songId);
      const relatedPlaylists = state.playlists.filter((playlist) => playlist.songIds.includes(songId));
      const prompt = relatedPlaylists.length
        ? `曲目“${song?.title || ""}”存在于 ${relatedPlaylists.length} 个歌单中，删除后会自动从这些歌单移除。确认继续吗？`
        : `确认删除曲目“${song?.title || ""}”？`;
      if (!window.confirm(prompt)) {
        return;
      }

      state.songs = state.songs.filter((item) => item.id !== songId);
      state.playlists.forEach((playlist) => {
        playlist.songIds = playlist.songIds.filter((id) => id !== songId);
      });
      if (state.selectedSongId === songId) {
        state.songMobileView = "list";
        state.selectedSongId = state.songs[0]?.id || null;
      }
      await saveRemoteData();
      render();
    }

    async function deletePlaylist(playlistId) {
      const playlist = findPlaylist(playlistId);
      if (!window.confirm(`确认删除歌单“${playlist?.name || ""}”？`)) {
        return;
      }

      state.playlists = state.playlists.filter((item) => item.id !== playlistId);
      if (state.selectedPlaylistId === playlistId) {
        state.playlistMobileView = "list";
        state.selectedPlaylistId = state.playlists[0]?.id || null;
      }
      await saveRemoteData();
      render();
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove("hidden");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.add("hidden");
      modal.setAttribute("aria-hidden", "true");

      if (id === "song-modal") {
        state.songDraftResources = [];
        elements.songForm.reset();
        document.getElementById("song-id").value = "";
        renderSongModalResources();
      }

      if (id === "playlist-modal") {
        state.playlistDraftSongIds = [];
        state.playlistSongSearch = "";
        elements.playlistForm.reset();
        document.getElementById("playlist-id").value = "";
      }

      if (id === "resource-modal") {
        elements.resourceForm.reset();
        document.getElementById("resource-context").value = "";
        document.getElementById("resource-song-id").value = "";
        document.getElementById("resource-id").value = "";
      }
    }

    function getFilteredSongs() {
      if (!state.songSearch) {
        return state.songs;
      }

      return state.songs.filter((song) => song.title.toLowerCase().includes(state.songSearch));
    }

    function groupSongsByInitial(songs) {
      const grouped = new Map();
      songs.forEach((song) => {
        const initial = getSongInitial(song.title);
        if (!grouped.has(initial)) {
          grouped.set(initial, []);
        }
        grouped.get(initial).push(song);
      });

      return Array.from(grouped.entries())
        .sort(([left], [right]) => compareInitials(left, right))
        .map(([initial, groupSongs]) => ({
          initial,
          songs: groupSongs.sort((left, right) => left.title.localeCompare(right.title, "zh-Hans-CN"))
        }));
    }

    function getSongInitial(title) {
      const value = String(title || "").trim();
      if (!value) {
        return "#";
      }
      const firstChar = value[0];
      if (/[A-Za-z]/.test(firstChar)) {
        return firstChar.toUpperCase();
      }
      if (/[0-9]/.test(firstChar)) {
        return "#";
      }
      return getChinesePinyinInitial(firstChar) || "#";
    }

    function getChinesePinyinInitial(char) {
      const boundaries = [
        ["A", "阿"], ["B", "芭"], ["C", "擦"], ["D", "搭"], ["E", "蛾"],
        ["F", "发"], ["G", "噶"], ["H", "哈"], ["J", "击"], ["K", "喀"],
        ["L", "垃"], ["M", "妈"], ["N", "拿"], ["O", "哦"], ["P", "啪"],
        ["Q", "期"], ["R", "然"], ["S", "撒"], ["T", "塌"], ["W", "挖"],
        ["X", "昔"], ["Y", "压"], ["Z", "匝"]
      ];
      for (let index = boundaries.length - 1; index >= 0; index -= 1) {
        const [letter, boundary] = boundaries[index];
        if (char.localeCompare(boundary, "zh-Hans-CN") >= 0) {
          return letter;
        }
      }
      return "";
    }

    function compareInitials(left, right) {
      if (left === "#" && right === "#") {
        return 0;
      }
      if (left === "#") {
        return -1;
      }
      if (right === "#") {
        return 1;
      }
      return left.localeCompare(right, "en");
    }

    function bindCardAction(element, handler) {
      element.addEventListener("click", handler);
      element.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          handler({ currentTarget: element });
        }
      });
    }

    function getDataApiUrl() {
      if (!WORKER_API_BASE || WORKER_API_BASE === "（我稍后填写）") {
        throw new Error("Please fill WORKER_API_BASE");
      }
      return `${WORKER_API_BASE.replace(/\/$/, "")}${DATA_API_PATH}`;
    }

    function loadLocalBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
        if (!raw) {
          return null;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") {
          return null;
        }
        return {
          songs: Array.isArray(parsed.songs) ? parsed.songs : [],
          setlists: Array.isArray(parsed.setlists) ? parsed.setlists : []
        };
      } catch (error) {
        console.warn("Failed to load local backup", error);
        return null;
      }
    }

    function saveLocalBackup(payload) {
      try {
        localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(payload));
      } catch (error) {
        console.warn("Failed to save local backup", error);
      }
    }

    async function loadRemoteData() {
      const previousSongId = state.selectedSongId;
      const previousPlaylistId = state.selectedPlaylistId;
      const response = await fetch(getDataApiUrl(), {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`GET /api/data failed: ${response.status}`);
      }

      const payload = await response.json();
      saveLocalBackup(payload);
      const songs = Array.isArray(payload?.songs) ? payload.songs.map((song) => hydrateSongRecord(song)) : [];
      const playlists = Array.isArray(payload?.setlists)
        ? payload.setlists.map((playlist) => ({
            id: playlist.id || playlist._id || createId(),
            name: playlist.name || "",
            notes: playlist.note || playlist.notes || "",
            songIds: Array.isArray(playlist.songs) ? playlist.songs : []
          }))
        : [];

      state.songs = songs;
      state.playlists = playlists;
      state.selectedSongId = songs.find((song) => song.id === previousSongId)?.id || songs[0]?.id || null;
      state.selectedPlaylistId = playlists.find((playlist) => playlist.id === previousPlaylistId)?.id || playlists[0]?.id || null;
    }

    function hydrateSongRecord(song) {
      const chordData = song?.chords;
      const chordProgression = typeof chordData === "string"
        ? chordData
        : chordData?.progression || chordData?.chords || song?.chordProgression || song?.lyricsChords || "";
      const lyrics = typeof chordData === "object" && chordData
        ? chordData.lyrics || song?.lyrics || ""
        : song?.lyrics || "";

      return {
        id: song?._id || song?.id || createId(),
        title: song?.name || song?.title || "",
        key: song?.key || "",
        level: normalizeLevel(song?.level),
        chartLink: getLegacyChartLink(song),
        resources: normalizeSongResources(song),
        chordProgression: normalizeMultilineText(chordProgression),
        lyrics: normalizeMultilineText(lyrics)
      };
    }

    function buildSongPayload(song) {
      return {
        id: song.id,
        name: song.title,
        key: song.key,
        level: Number(song.level),
        chords: {
          progression: song.chordProgression || "",
          lyrics: song.lyrics || ""
        },
        resources: normalizeSongResources(song).map(({ id, title, url, note }) => ({
          id,
          title,
          url,
          note
        })),
        updatedAt: Date.now()
      };
    }

    function buildSetlistPayload(playlist) {
      return {
        id: playlist.id,
        name: playlist.name,
        note: playlist.notes || "",
        songs: Array.isArray(playlist.songIds) ? playlist.songIds : [],
        updatedAt: Date.now()
      };
    }

    async function saveRemoteData() {
      const payload = {
        songs: state.songs.map((song) => buildSongPayload(song)),
        setlists: state.playlists.map((playlist) => buildSetlistPayload(playlist))
      };

      const response = await fetch(getDataApiUrl(), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        saveLocalBackup(payload);
        throw new Error(`POST /api/data failed: ${response.status}`);
      }

      saveLocalBackup(payload);
      return response.json();
    }

    function normalizeSongResources(song) {
      const baseResources = Array.isArray(song?.resources)
        ? song.resources.map((resource, index) => normalizeResourceItem(resource, index))
        : [];
      const legacyLink = getLegacyChartLink(song);
      return syncLegacyChartLinkResource(baseResources, legacyLink);
    }

    function normalizeResourceItem(resource, index) {
      return {
        id: resource?.id || `resource-${index}-${Math.random().toString(36).slice(2, 7)}`,
        role: resource?.role || "",
        title: resource?.title || "未命名资料",
        type: "其他",
        url: resource?.url || "",
        note: resource?.note || "",
        legacySource: resource?.legacySource || ""
      };
    }

    function getLegacyChartLink(song) {
      return normalizeMultilineText(song?.chartLink || song?.scoreLink || song?.["谱子链接"] || "").trim();
    }

    function syncLegacyChartLinkResource(resources, chartLink) {
      const nextResources = (resources || [])
        .map((resource, index) => normalizeResourceItem(resource, index))
        .filter((resource) => resource.legacySource !== "chartLink");

      if (!chartLink) {
        return nextResources;
      }

      nextResources.push({
        id: "legacy-chart-link",
        role: "其他",
        title: "旧版谱子链接",
        type: "其他",
        url: chartLink,
        note: "由旧谱子链接自动迁移",
        legacySource: "chartLink"
      });
      return nextResources;
    }

    function getSongResource(songId, resourceId) {
      const song = findSong(songId);
      if (!song) {
        return null;
      }
      return normalizeSongResources(song).find((resource) => resource.id === resourceId) || null;
    }

    function normalizeMultilineText(value) {
      return String(value || "")
        .replace(/\\r\\n/g, "\n")
        .replace(/\\n/g, "\n")
        .replace(/\r\n/g, "\n");
    }

    function findSong(id) {
      return state.songs.find((song) => song.id === id) || null;
    }

    function findPlaylist(id) {
      return state.playlists.find((playlist) => playlist.id === id) || null;
    }

    function syncMobileLayout() {
      const narrow = window.innerWidth <= 960;

      if (!narrow) {
        elements.songListView.classList.remove("hidden");
        elements.songDetailView.classList.remove("hidden");
        elements.playlistListView.classList.remove("hidden");
        elements.playlistDetailView.classList.remove("hidden");
        return;
      }

      const showSongDetail = state.songMobileView === "detail" && Boolean(state.selectedSongId);
      elements.songListView.classList.toggle("hidden", showSongDetail);
      elements.songDetailView.classList.toggle("hidden", !showSongDetail);

      const showPlaylistDetail = state.playlistMobileView === "detail" && Boolean(state.selectedPlaylistId);
      elements.playlistListView.classList.toggle("hidden", showPlaylistDetail);
      elements.playlistDetailView.classList.toggle("hidden", !showPlaylistDetail);
    }

    function normalizeLevel(level) {
      const numeric = Number(level);
      if (numeric >= 5) {
        return 4;
      }
      if (numeric >= 4) {
        return 3;
      }
      if (numeric >= 2) {
        return 2;
      }
      return 1;
    }

    function renderLevel(level) {
      return LEVEL_LABELS[normalizeLevel(level)] || LEVEL_LABELS[1];
    }

    function createId() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }
  </script>
</body>
